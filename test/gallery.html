<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>유닛 스프라이트 갤러리 (검증용)</title>
<style> body { background: #1c1f28; margin: 0; } </style>
</head>
<body>
<div id="app" style="position:relative">
<canvas id="game-canvas" width="405" height="1640"></canvas>
</div>
<script src="../js/data.js"></script>
<script src="../js/logic.js"></script>
<script src="../js/ui.js"></script>
<script>
  // 전 유닛 14종 스프라이트 일괄 렌더 — 이모지·성급·테두리 육안 확인용
  var canvas = document.getElementById('game-canvas');
  UI.initInput(canvas, { onDragStart: function(){}, onDragMove: function(){}, onDragEnd: function(){} });
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#232838';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  var ids = Object.keys(DATA.UNITS);
  ids.forEach(function (id, i) {
    var col = i % 4, row = Math.floor(i / 4);
    var x = 55 + col * 100, y = 60 + row * 95;
    var star = Math.min(DATA.STAR_CAP[DATA.UNITS[id].tier], (i % 3) + 1);
    UI.drawUnitSprite(x, y, id, star, { hint: i % 5 === 0, time: 1, hpFrac: 0.8, manaFrac: 0.5 });
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#8b93a7';
    ctx.textAlign = 'center';
    ctx.fillText(DATA.UNITS[id].name, x, y + 44);
  });
</script>
</body>
</html>
